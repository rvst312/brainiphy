[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brainiphy"
version = "0.1.0"
description = "Bootstrap and maintain graphify knowledge-graph brains for a business, from zero data sources to a synced graph connected to Claude."
requires-python = ">=3.9"
dependencies = ["pyyaml", "rich>=13"]
# Table form, not the PEP 639 SPDX string: setuptools here is 69.x, which
# only understands `license = "MIT"` from 77 onwards.
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]

[project.scripts]
brain = "brainiphy_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brainiphy_cli = ["launchd_template.plist"]
