name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is the real target (Keychain, launchd); Linux catches
          # accidental platform assumptions in the parts that are portable.
          - {os: macos-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.9"}   # the floor in pyproject.toml
          - {os: ubuntu-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Byte-compile every module
        # Catches syntax that the version floor does not support, in modules a
        # smoke test never imports (the connector templates, for instance).
        run: python -m compileall -q src

      - name: Import check
        # Every module, so a rename that misses a caller fails here rather than
        # at the first user who runs the command that touches it. Keep the list
        # complete when adding a module.
        run: python -c "from brainiphy_cli import actions, app, cli, collect, frontmatter, httpclient, keychain, keys, picker, presets, project, prompt, steps, sync, ui"

      - name: Templates and presets compile
        # Connector templates and presets are copied as text and never
        # imported, so a syntax error in one would otherwise surface only when
        # a user runs the connector it generated. compileall covers them.
        run: python -m compileall -q src/brainiphy_cli

      - name: Every preset is readable through the registry
        run: python -c "from brainiphy_cli import presets; [presets.PRESETS[n].text() for n in presets.names()]"

      - name: Smoke test
        # Everything that runs without graphify, an LLM key or a TTY.
        run: ./scripts/smoke.sh
